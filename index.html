<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#18252a"/><title>UE Reader · 소스 분석 작업공간</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
  /* Shown before the app bundle runs so the window is never blank. React replaces #root. */
  .boot-static{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:14px 'Segoe UI','Malgun Gothic',sans-serif;color:#4b5a61;background:#f6f7f8}
  .boot-static strong{font-size:18px;color:#28353b}
  .boot-static i{width:28px;height:28px;border-radius:50%;border:3px solid #d9dfe2;border-top-color:#a76337;animation:boot-spin .9s linear infinite}
  @keyframes boot-spin{to{transform:rotate(360deg)}}
  @media (prefers-color-scheme: dark){.boot-static{background:#1b252a;color:#85969f}.boot-static strong{color:#cbd5d9}.boot-static i{border-color:#35424a;border-top-color:#cd9a72}}
</style></head>
<body><div id="root"><div class="boot-static" role="status"><i></i><strong>UE Reader를 시작하는 중입니다</strong><span>화면을 불러오고 있습니다…</span></div></div><script type="module" src="/src/main.tsx"></script></body></html>
